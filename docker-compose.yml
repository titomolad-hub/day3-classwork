
services:
#Database Service
  db:
    image: postgres:15-alphine
    environment:
      POSTGRES_USER: nimcuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: nimcdb
    ports:
      - "5432:5432"
    volumes:
      - ./database/db-init.sql:/docker-entrypoint-initdb.d/init.sql
#Backend Service
  backend:
    build: ./backend
    environment:
      POSTGRES_DB_HOST: db
      POSTGRES_DB_PORT: 5432
      POSTGRES_DB_NAME: nimcdb
      POSTGRES_USER: nimcuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5000:5000"
    depends_on:
      - db

#Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "3000:3001"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend